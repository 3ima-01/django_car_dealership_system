[project]
name = "car-dealership-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.7",
    "django-debug-toolbar>=6.0.0",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "drf-yasg>=1.21.11",
    "psycopg[binary]>=3.2.11",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
develop = [
    "django-stubs>=5.2.7",
    "djangorestframework-stubs>=3.16.5",
    "mypy>=1.18.2",
]

[[tool.mypy.overrides]]
module = ["debug_toolbar.*","drf_yasg.*"]
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "car_dealership_system.settings"
