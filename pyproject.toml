[project]
name = "car-dealership-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.5.3",
    "django>=5.2.7",
    "django-countries>=8.2.0",
    "django-debug-toolbar>=6.0.0",
    "django-filter>=25.2",
    "django-money>=3.5.4",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "drf-yasg>=1.21.11",
    "flower>=2.0.1",
    "psycopg[binary]>=3.2.11",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
develop = [
    "django-stubs>=5.2.7",
    "djangorestframework-stubs>=3.16.5",
    "mypy>=1.18.2",
]
tests = [
    "chardet>=5.2.0",
    "coverage>=7.12.0",
    "factory-boy>=3.3.3",
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
    "pytest-factoryboy>=2.8.1",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "car_dealership_system.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = ["--nomigrations", "--reuse-db", "--tb=short", "-v"]

[[tool.mypy.overrides]]
module = ["debug_toolbar.*","drf_yasg.*"]
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "car_dealership_system.settings"
