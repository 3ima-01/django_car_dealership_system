services:
  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    restart: unless-stopped
    ports:
      - "5432:${DB_PORT}"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: