services:

  car_dealership_system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_dealership_system
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      database:
          condition: service_healthy
  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:${DB_PORT}"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASS}
    ports:
      - "6379:${REDIS_PORT}"
    volumes:
      - .redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default off -@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_PASS ~* &* +@all +@pubsub +publish +subscribe" >> /usr/local/etc/redis/users.acl
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
        '

volumes:
  postgres_data:
  redis_data:
    driver: local